<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>糖水合成器 · 开屏</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    background:#e8e8e8;
    display:flex; align-items:center; justify-content:center;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  }
  /* 手机框 */
  .phone {
    width: 340px; height: 720px;
    border-radius: 40px;
    box-shadow: 0 24px 60px rgba(0,0,0,.28);
    overflow:hidden; position:relative;
    background: linear-gradient(170deg,#fff3e6 0%,#ffe4ec 55%,#e8dcff 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .notch {
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:110px; height:22px; border-radius:12px; background:#1a1a1a; z-index:5;
  }
  .float { position:absolute; font-size:20px; opacity:.85; animation:floaty 4s infinite ease-in-out; }
  @keyframes floaty { 0%,100%{transform:translateY(0) rotate(-6deg);} 50%{transform:translateY(-16px) rotate(8deg);} }

  .logo { font-size:86px; animation:bounceIn 1s ease-out; position:relative; z-index:3;
          filter:drop-shadow(0 8px 14px rgba(200,120,80,.3)); }
  @keyframes bounceIn { 0%{transform:scale(0) rotate(-20deg); opacity:0;} 60%{transform:scale(1.15);} 100%{transform:scale(1) rotate(0); opacity:1;} }

  .appname {
    margin-top:18px; font-size:32px; font-weight:bold; color:#8a5a3b;
    letter-spacing:6px; animation:fadeUp 1s .3s both;
  }
  .tagline { margin-top:10px; font-size:14px; color:#b08a6d; letter-spacing:2px; animation:fadeUp 1s .5s both; }
  @keyframes fadeUp { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .loader { margin-top:44px; width:170px; height:8px; background:#f3dcc8; border-radius:99px; overflow:hidden; animation:fadeUp 1s .8s both; }
  .loader i { display:block; height:100%; width:0; border-radius:99px;
              background:linear-gradient(90deg,#ff9d6c,#ffb38a); animation:load 2.4s .9s forwards ease-in-out; }
  @keyframes load { 0%{width:0;} 60%{width:72%;} 85%{width:88%;} 100%{width:100%;} }
  .loadtext { margin-top:12px; font-size:12px; color:#c9a68b; letter-spacing:3px; animation:fadeUp 1s 1s both; }
  .loadtext::after { content:""; animation:dots 1.2s infinite; }
  @keyframes dots { 0%{content:"";} 33%{content:".";} 66%{content:"..";} 100%{content:"...";} }

  .credit { position:absolute; bottom:26px; text-align:center; font-size:11px; color:#c9a68b; letter-spacing:1px; line-height:1.8; animation:fadeUp 1s 1.2s both; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>

  <span class="float" style="top:15%;left:14%;animation-delay:.2s">🍬</span>
  <span class="float" style="top:22%;right:12%;animation-delay:.8s">✨</span>
  <span class="float" style="top:60%;left:10%;animation-delay:1.4s">🧋</span>
  <span class="float" style="top:66%;right:14%;animation-delay:.5s">🥭</span>
  <span class="float" style="top:40%;left:6%;animation-delay:1s">🍡</span>
  <span class="float" style="top:36%;right:7%;animation-delay:1.8s">🫧</span>

  <div class="logo">🍧</div>
  <div class="appname">糖水合成器</div>
  <div class="tagline">选三样小料，摇出今日份甜</div>

  <div class="loader"><i></i></div>
  <div class="loadtext">正在加糖</div>

  <div class="credit">概念原型 v0.1 ｜ 六加一 毕业设计项目<br/>本开屏由一只核动力色机手搓</div>
</div>
</body>
</html>
